<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiHadirQR - Presensi Sekolah</title>
    <meta name="description" content="Aplikasi presensi QR Code terintegrasi database sekolah, Asisten Guru AI (Generator Soal, Kunci, Kisi-kisi & Modul Ajar Word), notifikasi WhatsApp real-time, kartu pelajar, chat izin & sakit, serta analitik dan ekspor laporan." />
    <meta property="og:title" content="SiHadirQR - Presensi Sekolah" />
    <meta property="og:description" content="Aplikasi presensi QR Code terintegrasi database sekolah, Asisten Guru AI (Generator Soal, Kunci, Kisi-kisi & Modul Ajar Word), notifikasi WhatsApp real-time, kartu pelajar, chat izin & sakit, serta analitik dan ekspor laporan." />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SiHadirQR" />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased m-0 p-0">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); color: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; box-sizing: border-box; text-align: center;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #4f46e5, #3730a3); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4); margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.15);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M7 7h.01"/>
            <path d="M17 7h.01"/>
            <path d="M7 17h.01"/>
            <path d="M17 17h.01"/>
          </svg>
        </div>
        <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px;">
          SiHadir<span style="color: #fbbf24;">QR</span>
        </div>
        <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 24px; max-width: 320px; line-height: 1.5;">
          Sistem Informasi Presensi & Karakter Sekolah
        </div>
        <div style="display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.08); padding: 8px 16px; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, 0.12); font-size: 12px; font-weight: 600; color: #93c5fd;">
          <div style="width: 14px; height: 14px; border: 2px solid #93c5fd; border-top-color: transparent; border-radius: 50%; animation: sihadir_spin 0.8s linear infinite;"></div>
          <span>Memuat Aplikasi...</span>
        </div>
        <style>
          @keyframes sihadir_spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      // Fallback in case of uncaught script error preventing React mount
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.querySelector && root.querySelector('[style*="Memuat Aplikasi..."]')) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:sans-serif;padding:24px;text-align:center;">' +
            '<div style="background:#1e293b;border:1px solid #334155;border-radius:24px;padding:32px;max-width:400px;width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="font-size:18px;font-weight:800;margin:0 0 8px 0;">Gagal Memuat Halaman</h2>' +
            '<p style="font-size:12px;color:#94a3b8;margin:0 0 20px 0;line-height:1.5;">Terjadi kendala saat memuat berkas aplikasi. Silakan muat ulang halaman.</p>' +
            '<button onclick="window.location.reload(true)" style="background:#4f46e5;color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;width:100%;">Muat Ulang Halaman</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
