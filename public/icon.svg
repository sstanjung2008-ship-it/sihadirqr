<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring accent -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="#2563eb" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- QR Code & Scanner Container -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- QR Corner Top-Left -->
    <path d="M 0 0 L 100 0 L 100 30 L 30 30 L 30 100 L 0 100 Z" fill="url(#accentGrad)" />
    <rect x="42" y="42" width="36" height="36" rx="8" fill="#ffffff" />
    
    <!-- QR Corner Top-Right -->
    <path d="M 220 0 L 320 0 L 320 100 L 290 100 L 290 30 L 220 30 Z" fill="url(#accentGrad)" />
    <rect x="242" y="42" width="36" height="36" rx="8" fill="#ffffff" />
    
    <!-- QR Corner Bottom-Left -->
    <path d="M 0 220 L 30 220 L 30 290 L 100 290 L 100 320 L 0 320 Z" fill="url(#accentGrad)" />
    <rect x="42" y="242" width="36" height="36" rx="8" fill="#ffffff" />
    
    <!-- QR Center Elements & Checkmark Shield -->
    <circle cx="160" cy="160" r="68" fill="#2563eb" />
    <circle cx="160" cy="160" r="54" fill="#0a1128" />
    
    <!-- Checkmark icon inside center -->
    <path d="M 136 160 L 152 176 L 186 142" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Decorative Data Dots -->
    <rect x="146" y="44" width="28" height="28" rx="6" fill="#38bdf8" />
    <rect x="44" y="146" width="28" height="28" rx="6" fill="#38bdf8" />
    <rect x="248" y="146" width="28" height="28" rx="6" fill="#38bdf8" />
    <rect x="146" y="248" width="28" height="28" rx="6" fill="#38bdf8" />
    <rect x="234" y="234" width="32" height="32" rx="8" fill="url(#accentGrad)" />
    <rect x="274" y="274" width="32" height="32" rx="8" fill="#ffffff" />
  </g>
</svg>
